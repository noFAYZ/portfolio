<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faizan Asad — Software Engineer</title>
    <meta
      name="description"
      content="Faizan Asad is a full-stack software engineer in Islamabad building fast, accessible, well-crafted web apps."
    />
    <script>
      // before first paint, so the page never flashes the wrong theme
      let theme = null
      try {
        theme = localStorage.getItem("portfolio-theme")
      } catch (_) {}
      if (theme !== "dark" && theme !== "light")
        theme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark"
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
